<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="fcfs.css">
    <title>FCFS</title>
</head>

<body>
    <canvas id="matrix"></canvas>
    <div class="wrap">
        <h1>FCFS Calculator</h1>
        <div class="inputs">
            <div class="field">
                <label for="AT">ENTER ARRIVAL TIME</label>
                <input id="AT" type="text" aria-label="Arrival Time">
            </div>
            <div class="field">
                <label for="BT">ENTER BURST TIME</label>
                <input id="BT" type="text" aria-label="Burst Time">
            </div>
        </div>
        <button id="calculateBtn">Calculate</button>

        <div class="AnsTable" id="AnsTable">
            <table id="fcfsTable">
                <tr>
                    <th>Process</th>
                    <th>AT</th>
                    <th>BT</th>
                    <th>CT</th>
                    <th>TAT</th>
                    <th>WT</th>
                </tr>
            </table>
        </div>

        <div class="ExecOrder" id="ExecOrder">
            <h2>execution order</h2>
            <p id="eoOutput"></p>
        </div>

        <div class="GanttChart" id="GanttChart">
            <h2>Gantt chart</h2>
            <div id="gcProcesses"></div>
            <div id="gcTimes"></div>
        </div>

        <div class="avg">Avg TAT: 0.00 &nbsp;&nbsp; Avg WT: 0.00</div>
    </div>

    <script src="fcfs.js"></script>
</body>
</html>
